changelog: |-
  0.1.2: add English and Italian interface languages to the Search, Downloads, and Settings pages with a flag
  picker (English by default, per-browser-session choice), and show the dashboard side-menu entries in English.
  0.1.1: verify the selected torrent metainfo before download confirmation, display source and verified sizes,
  enforce the verified maximum size, and add an on-demand magnet copy action.
  0.1.0: first public GitHub release of TorrentClaw_Fin, with separate Search, Downloads, and Settings pages;
  TorrentClaw posters through a validated server-side proxy and result cards with audio and subtitle flags.
